services:
  node-red:
    image: docker.io/nodered/node-red:latest
    restart: unless-stopped
    environment:
      - TZ=Europe/Amsterdam
    ports:
      - "1880:1880"
    volumes:
      - ./nodered:/data
# USB serial devices     
      - /dev/usb-devices:/dev/usb-devices
# RS485(1) and RS485(2)      
    devices:
      - /dev/ttymxc2:/dev/ttymxc2
      - /dev/ttymxc3:/dev/ttymxc3
# Permissions for the admin user      
    userns_mode: keep-id
    user: 1002:1002